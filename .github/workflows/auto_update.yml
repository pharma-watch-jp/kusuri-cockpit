name: Daily MHLW Medicine Supply Auto-Updater

on:
  schedule:
    # 平日（月〜金） 日本時間（JST）1日6便パトロール体制（国民の祝日はスクリプト側で自動判定・スキップ）
    # 第1便: 05:04 JST (UTC 20:04 前日)
    - cron: '4 20 * * 0-4'
    # 第2便: 07:18 JST (UTC 22:18 前日)
    - cron: '18 22 * * 0-4'
    # 第3便: 09:23 JST (UTC 00:23 当日)
    - cron: '23 0 * * 1-5'
    # 第4便: 11:18 JST (UTC 02:18 当日)
    - cron: '18 2 * * 1-5'
    # 第5便: 12:33 JST (UTC 03:33 当日)
    - cron: '33 3 * * 1-5'
    # 第6便: 14:18 JST (UTC 05:18 当日・最終便)
    - cron: '18 5 * * 1-5'

  # 手動でもGitHub画面からポチッと実行できるようにする
  workflow_dispatch:
    inputs:
      force:
        description: '日付に関わらず強制同期するか'
        required: false
        type: boolean
        default: false

jobs:
  update-supply-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: 🐍 Python環境のセットアップ (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: 🚀 厚労省サイトから最新Excelを取得＆data.js差分生成
        run: |
          # 実行された時間（UTC/JST）から何便かを判定して引数へ渡す
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          
          SLOT_ARGS="--slot 1"
          if [ "$HOUR" -ge 21 ] || [ "$HOUR" -eq 20 -a "$MINUTE" -ge 30 ]; then
            SLOT_ARGS="--slot 2"
          elif [ "$HOUR" -eq 0 ] || [ "$HOUR" -eq 1 ]; then
            SLOT_ARGS="--slot 3"
          elif [ "$HOUR" -eq 2 ]; then
            SLOT_ARGS="--slot 4"
          elif [ "$HOUR" -eq 3 ] || [ "$HOUR" -eq 4 ]; then
            SLOT_ARGS="--slot 5"
          elif [ "$HOUR" -ge 5 ]; then
            SLOT_ARGS="--slot 6 --final"
          fi
          
          # 手動実行で強制フラグがある場合
          if [ "${{ inputs.force }}" = "true" ]; then
            SLOT_ARGS="$SLOT_ARGS --force"
          fi
          
          python update_mhlw_data.py $SLOT_ARGS

      - name: 📤 更新データが存在する場合のみ自動コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js prev_medicine_data.json diff_history.json yakka_master.json
          
          # 差分があるかチェック
          if git diff --staged --quiet; then
            echo "✅ 厚労省データに変更はありませんでした（最新状態を維持）"
          else
            echo "🎉 厚労省データの更新を検知！自動反映します"
            git commit -m "🤖 [Auto-Update] 厚労省最新医薬品供給データを自動反映 (data.js)"
            git push
          fi
